name: Bump version

on:
  workflow_dispatch:
    inputs:
      semver:
        description: "Which SemVer"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
  workflow_call:
    inputs:
      semver:
        description: Which SemVer component to bump.
        required: true
        type: string
jobs:
  bump:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Bump workspace versions and lockfile
        env:
          SEMVER: ${{ inputs.semver }}
        run: |
          case "$SEMVER" in
            major|minor|patch) ;;
            *) echo "Unsupported SemVer component: $SEMVER" >&2; exit 1 ;;
          esac
          npm version "$SEMVER" --no-git-tag-version --workspaces
          npm install --package-lock-only --ignore-scripts

      - name: Get new version
        id: get_version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const names = ['nestjs-firebase', 'nestjs-graphql-relay', 'nestjs-slack-webhook', 'nestjs-zendesk'];
          const versions = names.map((name) => JSON.parse(fs.readFileSync(`packages/${name}/package.json`, 'utf8')).version);
          if (new Set(versions).size !== 1) {
            throw new Error(`Workspace versions differ: ${versions.join(', ')}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `NEW_VERSION=${versions[0]}\n`);
          NODE

      - name: Generate release notes and update changelog
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get_release_note
        env:
          NEW_VERSION: ${{steps.get_version.outputs.NEW_VERSION}}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          result-encoding: string
          script: |
            const notes = await github.rest.repos.generateReleaseNotes(
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: `v${process.env.NEW_VERSION}`,
              }
            );
            const fs = require('node:fs');
            const date = new Date().toISOString().slice(0, 10);
            const section = `## v${process.env.NEW_VERSION} (${date})\n${notes.data.body.trim()}\n\n`;
            fs.writeFileSync('CHANGELOG.md', section + fs.readFileSync('CHANGELOG.md', 'utf8'));
            return notes.data.body;

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: release-${{ steps.get_version.outputs.NEW_VERSION }}
          token: ${{secrets.GITHUB_TOKEN}}
          commit-message: "bump: v${{ steps.get_version.outputs.NEW_VERSION }}"
          body: ${{ steps.get_release_note.outputs.result  }}
          title: "chore: bump v${{ steps.get_version.outputs.NEW_VERSION }}"
          draft: true
          milestone: "v${{ steps.get_version.outputs.NEW_VERSION }}"
