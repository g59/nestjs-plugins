name: Node CI
permissions:
  contents: read

on:
  push:

jobs:
  build:
    timeout-minutes: 3
    runs-on: ubuntu-slim
    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
      - run: biome ci .
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - name: Codecov Bundle Analysis
        run: |
          for package_dir in packages/*; do
            npx @codecov/bundle-analyzer "$package_dir/lib" \
              --bundle-name="${package_dir##*/}" \
              --upload-token="$CODECOV_TOKEN" \
              --ignore-patterns '**/*.map' '**/*.d.ts' '**/*.spec.js'
          done
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run lint
      - run: npm test
        env:
          SLACK_WEBHOOK_URL: https://example.com
          CI: true
      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Codecov Test Analytics
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./test-results.junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
